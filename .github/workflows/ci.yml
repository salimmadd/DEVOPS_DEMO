name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test backend
        working-directory: springboot/app
        run: bash ./mvnw test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: angular-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: angular-app
        run: npm ci

      - name: Build frontend
        working-directory: angular-app
        run: npm run build

  kubernetes:
    name: Build images and validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t demo-backend:ci ./springboot/app

      - name: Build frontend image
        run: docker build -t demo-frontend:ci ./angular-app

      - name: Validate Kubernetes manifests
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/work"
          -w /work
          ghcr.io/yannh/kubeconform:v0.6.7
          -strict -summary kubernetes
