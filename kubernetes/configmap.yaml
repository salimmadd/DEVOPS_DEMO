apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: tp-demo
data:
  SERVER_PORT: "8081"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/demo"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  APP_CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:18080,http://localhost:4200,http://localhost:30080,http://localhost:30081,http://localhost:38080,http://localhost:38182,http://localhost:8081"
  FRONTEND_API_URL: "http://localhost:18080"
  config.js: |
    window.__APP_CONFIG__ = {
      apiUrl: window.location.origin
    };
